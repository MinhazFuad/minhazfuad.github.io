  </g>

  <text x="240" y="272" text-anchor="middle" font-family="Space Grotesk, Inter, DejaVu Sans, sans-serif" font-size="128" font-weight="700" fill="#f97316" letter-spacing="-6">MA</text>
  <text x="240" y="326" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12" fill="#a3a3a3" letter-spacing="4">MD ABDUL AHAD MINHAZ</text>
  <rect x="196" y="352" width="88" height="3" rx="1.5" fill="#f97316"/>
</svg>
