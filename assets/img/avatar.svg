<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="avatarTitle avatarDesc">
  <title id="avatarTitle">Portrait placeholder for Md Abdul Ahad Minhaz</title>
  <desc id="avatarDesc">A monogram placeholder with a black technical grid and an orange accent.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f97316" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="480" height="480" rx="48" fill="#0a0a0a"/>
  <rect width="480" height="480" rx="48" fill="url(#grid)"/>
  <circle cx="240" cy="240" r="158" fill="none" stroke="#f97316" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="240" cy="240" r="128" fill="none" stroke="#737373" stroke-opacity="0.35" stroke-width="1"/>

  <g fill="none" stroke="#f97316" stroke-opacity="0.55" stroke-width="1.5">
    <circle cx="104" cy="138" r="4"/>
